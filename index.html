.card{

margin:auto;
background:white;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

.banner{
height:200px;
background:url('banner.jpg');
background-size:cover;
background-position:center;
position:relative;
}

.profile{
width:180px;
height:180px;
background:white;
border-radius:35px;
overflow:hidden;
position:absolute;
left:50%;
bottom:-80px;
transform:translateX(-50%);
box-shadow:0 0 15px rgba(0,0,0,.3);
}

.profile img{
width:100%;
height:100%;
object-fit:cover;
}

.logo{
width:70px;
height:70px;
background:white;
border-radius:50%;

right:-15px;
bottom:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

.logo img{
width:100%;
height:100%;
object-fit:contain;
}

.blue{
background:#0AA3D9;
padding-top:120px;
padding-bottom:50px;
text-align:center;
color:white;
border-bottom-left-radius:50% 40px;
border-bottom-right-radius:50% 40px;
}

.name{
font-size:28px;
font-weight:bold;
}

.job{
margin-top:10px;
font-size:18px;
}

.company{
margin-top:15px;
font-size:20px;
font-weight:bold;
}

.button{
display:block;
width:280px;
margin:30px auto;
padding:18px;
border:2px solid navy;
border-radius:50px;
background:white;
color:navy;
text-decoration:none;
font-weight:bold;
}

.contact{
padding:30px;
}

.contact h2{
text-align:center;
color:#003366;
}

.row{
margin:20px 0;
}

.qr{
text-align:center;
margin-top:30px;
}

.qr img{
width:150px;
}

</style>

</head>

<body>

<div class="card">

<div class="banner">
