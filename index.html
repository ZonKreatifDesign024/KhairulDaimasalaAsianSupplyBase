<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Khairul Bin Daimasala</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#e5e5e5;
padding:20px;
}

.card{
max-width:430px;
margin:auto;
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

.banner{
height:220px;
background:url('banner.jpg');
background-size:cover;
background-position:center;
position:relative;
}

.profile{
width:180px;
height:180px;
position:absolute;
left:50%;
bottom:-80px;
transform:translateX(-50%);
border-radius:35px;
overflow:hidden;
border:4px solid white;
background:white;
box-shadow:0 5px 15px rgba(0,0,0,0.25);
}

.profile img{
width:100%;
height:100%;
object-fit:cover;
}

.logo{
width:50px;
height:50px;
position:absolute;
bottom:10px;
right:10px;
background:white;
border-radius:50%;
padding:5px;
}

.logo img{
width:100%;
height:100%;
object-fit:contain;
}

.blue{
background:#13A7DA;
padding:120px 25px 60px;
text-align:center;
color:white;
border-bottom-left-radius:50% 50px;
border-bottom-right-radius:50% 50px;
}

.name{
font-size:20px;
font-weight:bold;
margin-bottom:10px;
}

.job{
font-size:16px;
line-height:1.5;
}

.company{
font-size:16px;
font-weight:bold;
margin-top:15px;
}

.tag{
font-size:12px;
letter-spacing:2px;
margin-top:8px;
opacity:0.9;
}

.button{
display:block;
margin:30px auto 0;
width:260px;
padding:16px;
background:#003A7A;
color:white;
border-radius:40px;
text-decoration:none;
font-weight:bold;
border:2px solid white;
}

.contact{
padding:35px 25px;
}

.contact h2{
text-align:center;
margin-bottom:30px;
color:#003A7A;
}

.contact-grid{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
}

.contact-left{
flex:1;
}

.info{
margin-bottom:20px;
word-break:break-word;
}

.info a{
color:#0056b3;
text-decoration:none;
}

.contact-right{
background:#f5f5f5;
padding:10px;
border-radius:15px;
}

.contact-right img{
width:120px;
display:block;
}

.footer{
text-align:center;
padding:15px;
font-size:12px;
color:#666;
border-top:1px solid #eee;
}

@media(max-width:768px){

.contact-grid{
flex-direction:column;
text-align:center;
}

.contact-right{
margin-top:15px;
}

}

</style>

</head>

<body>

<div class="card">

<div class="banner">

<div class="profile">
<img src="profile.jpg" alt="Profile">

<div class="logo">
<img src="logo.png" alt="Logo">
</div>

</div>

</div>

<div class="blue">

<div class="name">
Khairul Bin Daimasala
</div>

<div class="job">
Executive Graphic Designer<br>
(Creative & Branding)
</div>

<div class="company">
Asian Supply Base Sdn. Bhd.
</div>

<div class="tag">
LABUAN • MALAYSIA
</div>

<a href="contact.vcf" class="button">
Save My Contact
</a>

</div>

<div class="contact">

<h2>Contact Details</h2>

<div class="contact-grid">

<div class="contact-left">

<div class="info">
📞 +018 870 3207
</div>

<div class="info">
✉ khairuldaimasala@asiansupplybase.com
</div>

<div class="info">
🌐
<a href="https://asiansupplybase.my/" target="_blank">
asiansupplybase.my
</a>
</div>

</div>

<div class="contact-right">
<img src="qrcode.png" alt="QR Code">
</div>

</div>

</div>

<div class="footer">
Powered by ZKD Khairul Daimasala
</div>

</div>

</body>
</html>
